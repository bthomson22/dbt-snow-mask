snapshots:
  - name: ods_customers
    relation: source('seeds', 'customer')
    config:
      schema: pii
      strategy: timestamp
      unique_key: customer_id
      updated_at: last_update
      invalidate_hard_deletes: true
    columns:
      - name: email
        config:
          meta:
            masking_policy: mp_encrypt_pii